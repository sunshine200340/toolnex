<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9894972538238783"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolNex Arcade – Free Online Games</title>
    <meta name="description" content="Play free online games at ToolNex Arcade. Enjoy racing, puzzle, strategy, simulation, match-3 and more. No download required.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===== Reset & Base ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4f8;
            color: #0f172a;
            line-height: 1.5;
            padding: 16px;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* ===== Header ===== */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #0A2463;
            letter-spacing: -0.5px;
        }
        .logo span { color: #D4AF37; }
        .header-nav {
            display: flex;
            gap: 20px;
            font-size: 14px;
            font-weight: 500;
            color: #475569;
        }
        .header-nav a { text-decoration: none; color: inherit; transition: color 0.2s; }
        .header-nav a:hover { color: #0A2463; }
        .header-nav a.active { color: #0A2463; font-weight: 600; }

        /* ===== Category Tabs ===== */
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 20px 0 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #dce2ea;
        }
        .category-tabs .tab {
            padding: 6px 16px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid #dce2ea;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .category-tabs .tab:hover,
        .category-tabs .tab.active {
            background: #0A2463;
            color: #fff;
            border-color: #0A2463;
        }

        /* ===== Game Grid ===== */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }
        .game-card {
            background: #fff;
            border-radius: 12px;
            padding: 16px 12px 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            transition: transform 0.15s, box-shadow 0.2s;
            border: 1px solid #e9edf2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border-color: #cbd5e1;
        }
        .game-card .icon {
            font-size: 36px;
            margin-bottom: 6px;
            line-height: 1;
        }
        .game-card .title {
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 3px;
        }
        .game-card .category-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #64748b;
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 999px;
            display: inline-block;
            margin-top: 2px;
        }

        /* ===== Section Title ===== */
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin: 32px 0 16px;
            color: #0A2463;
            border-left: 4px solid #D4AF37;
            padding-left: 14px;
        }

        /* ===== Footer ===== */
        .site-footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 13px;
            color: #94a3b8;
        }
        .site-footer a {
            color: #475569;
            text-decoration: none;
            margin: 0 8px;
        }
        .site-footer a:hover { color: #0A2463; }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
            .game-card { padding: 12px 8px; }
            .game-card .icon { font-size: 28px; }
            .game-card .title { font-size: 12px; }
            .site-header { flex-direction: column; align-items: flex-start; }
            .header-nav { flex-wrap: wrap; gap: 12px; }
        }
        @media (max-width: 480px) {
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }
            .game-card .icon { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== Header ===== -->
        <header class="site-header">
            <div class="logo">Tool<span>Nex</span> Arcade</div>
            <nav class="header-nav">
                <a href="#" class="active">Home</a>
                <a href="#">New</a>
                <a href="#">Popular</a>
                <a href="contact.html">Contact</a>
            </nav>
        </header>

        <!-- ===== Category Tabs (filter) ===== -->
        <div class="category-tabs">
            <a href="#" class="tab active" data-category="all">All</a>
            <a href="#" class="tab" data-category="arcade">Arcade</a>
            <a href="#" class="tab" data-category="racing">Racing</a>
            <a href="#" class="tab" data-category="simulation">Simulation</a>
            <a href="#" class="tab" data-category="match3">Match 3</a>
            <a href="#" class="tab" data-category="sports">Sports</a>
            <a href="#" class="tab" data-category="strategy">Strategy</a>
            <a href="#" class="tab" data-category="puzzle">Puzzle</a>
        </div>

        <!-- ===== Game Grid ===== -->
        <div class="game-grid" id="gameGrid">
            <!-- 所有游戏卡片将在此由 JavaScript 动态生成 -->
        </div>

        <!-- ===== Footer ===== -->
        <footer class="site-footer">
            <span>&copy; 2026 ToolNex. All games are property of their respective owners.</span>
            <span>
                <a href="privacy.html">Privacy</a>
                <a href="terms.html">Terms</a>
                <a href="contact.html">Contact</a>
            </span>
        </footer>
    </div>

    <script>
        // ===== 游戏数据（共 26 款） =====
        const games = [
            // ----- Arcade (5) -----
            { id: 1, title: "Metro Color Rush", category: "arcade", icon: "🎨" },
            { id: 2, title: "Space Shooter X", category: "arcade", icon: "🚀" },
            { id: 3, title: "Neon Runner", category: "arcade", icon: "💡" },
            { id: 4, title: "Bubble Pop Adventure", category: "arcade", icon: "🫧" },
            { id: 5, title: "Fruit Ninja Web", category: "arcade", icon: "🍉" },
            // ----- Racing (5) -----
            { id: 6, title: "Speed Race Drift", category: "racing", icon: "🏎️" },
            { id: 7, title: "Highway Racer", category: "racing", icon: "🛣️" },
            { id: 8, title: "Moto X3M", category: "racing", icon: "🏍️" },
            { id: 9, title: "Drift Hunters", category: "racing", icon: "🎮" },
            { id: 10, title: "Traffic Run", category: "racing", icon: "🚦" },
            // ----- Simulation (5) -----
            { id: 11, title: "Farm Village Simulator", category: "simulation", icon: "🌾" },
            { id: 12, title: "City Builder Online", category: "simulation", icon: "🏙️" },
            { id: 13, title: "Cooking Fever Web", category: "simulation", icon: "🍳" },
            { id: 14, title: "Pet Care Simulator", category: "simulation", icon: "🐾" },
            { id: 15, title: "Flight Simulator Lite", category: "simulation", icon: "✈️" },
            // ----- Match 3 (4) -----
            { id: 16, title: "Candy Match Blast", category: "match3", icon: "🍬" },
            { id: 17, title: "Block Puzzle Classic", category: "match3", icon: "🧩" },
            { id: 18, title: "Jigsaw Master", category: "match3", icon: "🖼️" },
            { id: 19, title: "Sudoku Daily", category: "match3", icon: "🔢" },
            // ----- Sports (4) -----
            { id: 20, title: "Mini Basketball Shootout", category: "sports", icon: "🏀" },
            { id: 21, title: "Soccer Kick Challenge", category: "sports", icon: "⚽" },
            { id: 22, title: "Tennis Ace", category: "sports", icon: "🎾" },
            { id: 23, title: "Golf Pro", category: "sports", icon: "⛳" },
            // ----- Strategy (5) -----
            { id: 24, title: "Tower Defense Kingdom", category: "strategy", icon: "🏰" },
            { id: 25, title: "Chess Online", category: "strategy", icon: "♟️" },
            { id: 26, title: "Checkers Classic", category: "strategy", icon: "🟥" },
            { id: 27, title: "Solitaire Collection", category: "strategy", icon: "🃏" },
            { id: 28, title: "Mahjong Dimensions", category: "strategy", icon: "🀄" },
            // ----- Puzzle (新增 4 款, 已包含在 match3 中？但用户单独列出 Puzzle，我们增加额外游戏 -----
            // 为避免重复，我们新增 4 款不同的 puzzle 游戏
            { id: 29, title: "Word Search Pro", category: "puzzle", icon: "🔍" },
            { id: 30, title: "2048 Challenge", category: "puzzle", icon: "🔢" },
            { id: 31, title: "Crossword Daily", category: "puzzle", icon: "📝" },
            { id: 32, title: "Memory Match", category: "puzzle", icon: "🧠" }
        ];

        // 分类显示标签映射
        const categoryLabels = {
            arcade: 'Arcade',
            racing: 'Racing',
            simulation: 'Simulation',
            match3: 'Match 3',
            sports: 'Sports',
            strategy: 'Strategy',
            puzzle: 'Puzzle'
        };

        // 获取网格容器
        const grid = document.getElementById('gameGrid');

        // 渲染函数
        function renderGames(filterCategory = 'all') {
            const filtered = games.filter(g => filterCategory === 'all' || g.category === filterCategory);
            grid.innerHTML = '';
            filtered.forEach(game => {
                const card = document.createElement('a');
                card.href = `game.html?id=${game.id}`; // 模拟链接
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="icon">${game.icon}</div>
                    <div class="title">${game.title}</div>
                    <span class="category-label">${categoryLabels[game.category] || game.category}</span>
                `;
                grid.appendChild(card);
            });
        }

        // 初始渲染全部
        renderGames('all');

        // 分类标签点击切换
        document.querySelectorAll('.category-tabs .tab').forEach(tab => {
            tab.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.category-tabs .tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                const cat = this.dataset.category;
                renderGames(cat);
            });
        });
    </script>

</body>
</html>
