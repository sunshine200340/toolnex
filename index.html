<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolNex - AI Cartoon Generator</title>
  <meta name="description" content="Upload your photo and transform into a cartoon instantly! Supports multiple styles.">

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SEO / Open Graph -->
  <meta property="og:title" content="AI Cartoon Generator">
  <meta property="og:description" content="Turn Yourself Into Cartoon Online Free">
  <meta property="og:image" content="/preview.jpg">
  <meta property="og:type" content="website">
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

  <!-- Header -->
  <header class="bg-white shadow-md py-8 text-center relative">
    <h1 class="text-4xl font-bold mb-2">Turn Yourself Into a Cartoon!</h1>
    <p class="text-gray-600 text-lg max-w-2xl mx-auto">
      Upload a photo and choose a style to transform yourself instantly.
    </p>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto mt-12 px-4">

    <!-- Upload Section -->
    <section class="bg-white p-6 rounded-lg shadow-md text-center">
      <h2 class="text-2xl font-semibold mb-4">Upload Your Photo</h2>
      <input type="file" accept="image/*" id="photoUpload" class="mb-4">

      <!-- Style Selection -->
      <div class="mt-6">
        <h3 class="font-semibold mb-3">Choose a Style</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <button class="style-btn border rounded p-3" data-style="ghibli">🌸 Ghibli</button>
          <button class="style-btn border rounded p-3" data-style="pixar">🎬 Pixar</button>
          <button class="style-btn border rounded p-3" data-style="anime">🎨 Anime</button>
          <button class="style-btn border rounded p-3" data-style="disney">🏰 Disney</button>
          <button class="style-btn border rounded p-3" data-style="simpsons">😄 Simpsons</button>
          <button class="style-btn border rounded p-3" data-style="watercolor">🖌 Watercolor</button>
          <button class="style-btn border rounded p-3" data-style="comic">💥 Comic</button>
          <button class="style-btn border rounded p-3" data-style="3d">🧊 3D Cartoon</button>
        </div>
      </div>

      <!-- Generate Button -->
      <button id="generateBtn" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600 transition mt-6">
        Generate Cartoon
      </button>

      <!-- Loading -->
      <div id="loading" class="hidden mt-6">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto"></div>
        <p class="mt-4 text-gray-500">Generating...</p>
      </div>
    </section>

    <!-- Preview Section -->
    <section class="bg-white p-6 rounded-lg shadow-md text-center mt-8 hidden" id="previewSection">
      <h2 class="text-2xl font-semibold mb-4">Preview</h2>
      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <img id="originalImage" src="" alt="Original Photo" class="w-full h-64 object-cover rounded-lg border">
          <p class="text-gray-500 mt-2">Before</p>
        </div>
        <div>
          <img id="cartoonImage" src="" alt="Cartoon Photo" class="w-full h-64 object-cover rounded-lg border">
          <p class="text-gray-500 mt-2">After</p>
        </div>
      </div>
      <button id="downloadBtn" class="mt-6 bg-green-500 text-white px-6 py-2 rounded hover:bg-green-600 transition">
        Download Cartoon
      </button>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-white text-center py-6 border-t mt-12">
    <p class="text-gray-500 text-sm">&copy; 2026 ToolNex.xyz. All rights reserved.</p>
  </footer>

  <!-- JS -->
  <script>
    const photoUpload = document.getElementById('photoUpload');
    const generateBtn = document.getElementById('generateBtn');
    const previewSection = document.getElementById('previewSection');
    const originalImage = document.getElementById('originalImage');
    const cartoonImage = document.getElementById('cartoonImage');
    const downloadBtn = document.getElementById('downloadBtn');
    const loading = document.getElementById('loading');

    let selectedStyle = 'ghibli';

    // Style selection
    document.querySelectorAll('.style-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('bg-blue-100'));
        btn.classList.add('bg-blue-100');
        selectedStyle = btn.dataset.style;
      });
    });

    // Generate Cartoon
    generateBtn.addEventListener('click', async () => {
      const file = photoUpload.files[0];
      if (!file) {
        alert('Please upload a photo first!');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        originalImage.src = e.target.result;
      }
      reader.readAsDataURL(file);

      previewSection.classList.remove('hidden');
      loading.classList.remove('hidden');

      // ======= 调用后端 API 生成卡通图 =======
      // 注意：这里必须替换为你自己的后端 API
      const formData = new FormData();
      formData.append('image', file);
      formData.append('style', selectedStyle);

      try {
        const response = await fetch('/api/cartoon', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        cartoonImage.src = data.imageUrl; // 后端返回的卡通图 URL
      } catch (err) {
        alert('Failed to generate cartoon');
        console.error(err);
      }

      loading.classList.add('hidden');
    });

    // Download cartoon
    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.href = cartoonImage.src;
      link.download = 'cartoon.png';
      link.click();
    });
  </script>
</body>
</html>
