<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Privacy Policy</title>
    <!-- 你原来所有的CSS、样式、公共头部样式全部保留不动 -->
</head>
<body>
<!-- 你的网站导航、页脚header/footer完全保留原样 -->

<div class="privacy-content">
    <!-- 文案会通过JS自动填充，这里不需要写死任何文字 -->
    <h1 id="privacy-title"></h1>
    <div id="privacy-body"></div>
</div>

<!-- 页脚代码保留 -->

<script>
// 1. 多语言文案库：把你各个语种的隐私政策完整内容粘贴进来
const privacyTexts = {
    en: {
        title: "Privacy Policy",
        content: `
            <h2>1. Information We Collect</h2>
            <p>We collect browsing data, IP address, device information to improve our service...</p>
            <!-- 粘贴你的完整英文隐私政策 -->
        `
    },
    ja: {
        title: "プライバシーポリシー",
        content: `
            <h2>1. 収集する情報について</h2>
            <p>当サイトではサービス改善を目的とし、閲覧者のIPアドレス、端末情報などを取得する場合があります...</p>
            <!-- 粘贴你的完整日文隐私政策 -->
        `
    },
    zh: {
        title: "隐私政策",
        content: `
            <h2>一、我们收集的信息</h2>
            <p>本站为优化服务体验，会收集访客IP、设备浏览信息等数据...</p>
            <!-- 粘贴你的完整中文隐私政策 -->
        `
    },
    de: {
        title: "Datenschutzrichtlinie",
        content: `这里粘贴德语隐私政策全文`
    },
    fr: {
        title: "Politique de confidentialité",
        content: `这里粘贴法语隐私政策全文`
    },
    es: {
        title: "Política de privacidad",
        content: `这里粘贴西班牙语隐私政策全文`
    }
};

// 2. 读取你首页切换语言时存在本地存储的语言（和你全站键名保持一致）
// 如果你的存储key不是 siteLang，替换成你项目里实际的key，比如 lang、site_lang
const userLang = localStorage.getItem('siteLang') || 'en';

// 3. 匹配语种，兜底默认英文
const currentText = privacyTexts[userLang] || privacyTexts.en;

// 4. 渲染内容到页面
document.getElementById('privacy-title').innerText = currentText.title;
document.getElementById('privacy-body').innerHTML = currentText.content;

// 同步修改网页html语言标识，利于SEO
document.documentElement.lang = userLang;
</script>
</body>
</html>
